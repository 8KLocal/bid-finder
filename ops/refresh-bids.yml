name: Refresh bids
on:
  schedule:
    - cron: "17 11 * * *"   # daily, ~6-7 AM ET
  workflow_dispatch:
permissions:
  contents: write
concurrency: refresh-bids
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch SAM.gov public opportunities extract
        run: python scripts/fetch_bids.py
      - name: Commit if changed
        run: |
          git config user.name "bid-finder-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bids.json
          git diff --cached --quiet && echo "No changes" || (git commit -m "Refresh bids $(date -u +%F)" && git push)
