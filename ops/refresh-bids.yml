name: Refresh bids
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: SAM.gov only, then rebuild the feed
        run: |
          node scripts/feed/run.mjs sam
          node scripts/feed/run.mjs build
      - name: Commit if changed
        run: |
          git config user.name "bid-finder-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bids.json data/feed data/raw 2>/dev/null || git add data/bids.json data/feed
          git diff --cached --quiet && echo "No changes" || (git commit -m "Refresh SAM.gov bids $(date -u +%F)" && git push)
