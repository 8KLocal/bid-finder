name: Refresh RFPMart bids
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: RFPMart only, then rebuild the feed
        run: |
          node scripts/feed/run.mjs rfpmart
          node scripts/feed/run.mjs build
      - name: Commit if changed
        run: |
          git config user.name "bid-finder-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rfp-bids.json data/feed
          git diff --cached --quiet && echo "No changes" || (git commit -m "Refresh RFPMart bids $(date -u +%F)" && git push)
